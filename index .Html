<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Responsive Photo Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="text-center p-3">
    <h1>My Custom Photo Gallery</h1>
    <p>This is a collection of images showcasing moments that inspire joy, creativity, and serenity. Each picture tells a unique story and was carefully selected to evoke emotion and connection.</p>
  </header>

  <main class="container">
    <section class="gallery d-grid gap-2">
      <figure><img src="https://media.istockphoto.com/id/855022728/photo/view-of-the-plateau-soni-kougen-in-japan.jpg?s=612x612&w=0&k=20&c=uAhE4c7B52DPi2r1FmPtfrcV0wZvaQjg8f1B5AsHJXw=" alt="Mountain landscape" class="img-fluid" /><figcaption>Mountain Escape</figcaption></figure>
      <figure><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCLwxtFuBPlhbh0BRJDD0MW5fp8v9PtnTyeQ&s" alt="City skyline at sunset" class="img-fluid" /><figcaption>City Lights</figcaption></figure>
      <figure><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCMnHQuEPAjgDYFdK_pM6lMDsDZGFA0FUZgad1EZQ4rikyuM_nLi_lWWgNIwqq1hnWlUU&usqp=CAU" alt="Forest path in autumn" class="img-fluid" /><figcaption>Autumn Walk</figcaption></figure>
      <figure><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTx8LQmw2jQzAt9V9gtL9gNCB414-aYC8YUtQ&s" alt="Ocean waves crashing" class="img-fluid" /><figcaption>Ocean Power</figcaption></figure>
      <figure><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRb3f57WE3duH35ZnYHWSwJDLY2LxuzUXqPgQ&s" alt="A cozy cabin in the woods" class="img-fluid" /><figcaption>Cabin Calm</figcaption></figure>
      <figure><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpe71rVVk5OZv8ooDALzd020PfeqwOh-7ivA&s" alt="Starry night sky" class="img-fluid" /><figcaption>Starry Dreams</figcaption></figure>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
